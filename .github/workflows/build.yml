name: Web demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - run: npm ci
      - name: Engine tests (core workflow, 20 phrases, redactor, bill parser)
        run: npx vitest run
      - name: Build (no keys needed)
        run: npm run build

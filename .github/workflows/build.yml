name: Build APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build debug APKs (no keys needed: Demo Mode)
        run: ./gradlew :app:assembleDebug :demo-upi:assembleDebug --console=plain
      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/batao-kaise-debug.apk
          cp demo-upi/build/outputs/apk/debug/demo-upi-debug.apk out/demo-pay-debug.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            Install both APKs on an Android 8+ phone. Batao Kaise runs in Demo Mode with no keys.
            Demo Pay is a dummy UPI app: DEMO, no real money. See README for permissions and the demo walkthrough.
